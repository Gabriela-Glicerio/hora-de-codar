<script>
    
    var soma = 0
    var contador = 0


    for(i = 15; i <= 100; i ++){
        soma = soma + i
        contador ++
    }

    alert ("Soma: " + soma);
    alert ("Contador: " + contador);
    var média = (soma/contador);

    alert("Sua média: " + média )

</script>
