<script>
    var DataNasc = Number(prompt("Digite seu ano de nascimento:"));
    var anoAtual = new Date().getFullYear();
    
    var idade = anoAtual - DataNasc

    if(idade < 16){
        alert(`Idade não permitida para votar!`)
    }else if (idade >= 16){
        alert(`Você tem idade para votar!`)
    }
</script>
